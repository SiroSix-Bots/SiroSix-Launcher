name: Launcher bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SIROSIX_BUILD_DIR: ${{ github.workspace }}\..\builds
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka==4.3.5 ordered-set zstandard

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Nuitka-Cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-launcher-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Bauen
        run: python build_windows.py

      - name: Prüfen
        shell: pwsh
        run: |
          $exe = Join-Path $env:SIROSIX_BUILD_DIR "launcher\SiroSix-Launcher.exe"
          if (-not (Test-Path $exe)) { throw "EXE fehlt" }
          $size = (Get-Item $exe).Length
          "Groesse: $([math]::Round($size / 1MB, 1)) MB"
          "SHA-256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          New-Item -ItemType Directory -Force ausgabe | Out-Null
          Copy-Item $exe ausgabe\SiroSix-Launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: SiroSix-Launcher
          path: ausgabe\SiroSix-Launcher.exe
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME ausgabe\SiroSix-Launcher.exe --title "SiroSix Launcher $env:GITHUB_REF_NAME" --notes "SiroSix Launcher $env:GITHUB_REF_NAME"
